name: lifequest
description: "LifeQuest — turn real-life goals into an RPG adventure."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  appwrite: ^26.2.0
  crypto: ^3.0.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Launcher icon (regenerate with `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#C44560"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
